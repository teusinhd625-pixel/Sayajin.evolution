<style>
/* Layout: app de celular em coluna única, abas fixas embaixo, splash de 3,4 s por cima de tudo. Visual escuro único, tirado da logo (neon ciano para azul sobre marinho). */

}

.xpb { background: var(--red); color: #fff; border: 0; padding: 4px 11px; }
.mission { flex-wrap: wrap; }

    }

  function renderPerfil() {
    document.getElementById('s-perfil').innerHTML =
      '<div><h1>Perfil</h1></div>' +
      '<div class="card" style="display:flex;flex-direction:column;gap:14px">' +
      '<div class="field"><label for="pname">Seu nome</label><input id="pname" maxlength="24" value="' + esc(S.name) + '"></div>' +
      '<div class="row">' + avatar(true) + '<div class="grow"><b>Foto de perfil</b><br><small class="muted">Toque em Trocar para escolher outra.</small></div><button class="btn ghost sm" id="ppick">Trocar</button><input type="file" id="pphoto" accept="image/*" hidden></div>' +
      '<div class="field"><label for="page">Idade</label><input id="page" type="number" inputmode="numeric" min="10" max="100" value="' + (S.age || '') + '"></div>' +
      '<div class="field"><label for="pgoal">Meta de treinos por semana</label><select id="pgoal">' + [2, 3, 4, 5, 6, 7].map(function (n) { return '<option value="' + n + '"' + (n === S.goal ? ' selected' : '') + '>' + n + ' treinos</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="pplace">Onde você treina</label><select id="pplace"><option value="academia"' + (place() === 'academia' ? ' selected' : '') + '>Academia</option><option value="casa"' + (place() === 'casa' ? ' selected' : '') + '>Casa</option></select></div>' +
      '<button class="btn" id="psave">Salvar</button></div>' +
      '<div class="card"><h2>Apagar tudo</h2><p class="muted" style="margin:4px 0 12px">Remove treinos, pesos e ajustes deste aparelho.</p><button class="btn ghost" id="reset">Apagar dados</button></div>';
  }

  /* ---------- eventos ---------- */
  document.getElementById('app').addEventListener('click', function (e) {
    var t = e.target;
    var gp = t.closest('[data-grp]'); if (gp) return openMissions(gp.dataset.grp);
    if (t.closest('[data-claim]')) return claimReward();
    var ac = t.closest('[data-act]');
    if (ac) { if (ac.dataset.act === 'xp2') return activateXp2(); skipOpen = !skipOpen; return renderHome(); }
    var sk = t.closest('[data-skip]'); if (sk) { var pr = sk.dataset.skip.split('|'); return doSkip(pr[0], +pr[1]); }
    var qo = t.closest('[data-qopen]'); if (qo) { var qi = +qo.dataset.qopen; openQ = (openQ === qi ? -1 : qi); var yy = window.scrollY; renderMissoes(); window.scrollTo(0, yy); return; }
    var qk = t.closest('[data-qn]'); if (qk) return setQty(+qk.dataset.qi, +qk.dataset.qn);
    var st = t.closest('[data-start]'); if (st) return startWorkout(st.dataset.start);
    if (t.closest('[data-back]')) return go('treinos');
    var sb = t.closest('.set');
    if (sb && run) {
      var a = +sb.dataset.ex, b = +sb.dataset.set;
      run.sets[a][b] = !run.sets[a][b];
      var wasRest = run.rest, y = window.scrollY;
      renderRun(); window.scrollTo(0, y);
      if (run.sets[a][b]) startRest(60); else if (wasRest) { run.rest = 0; clearInterval(rInt); }
      return;
    }
    var rs = t.closest('[data-rest]'); if (rs) return startRest(+rs.dataset.rest);
    if (t.closest('#finish')) return finishWorkout();
    if (t.closest('#ppick')) return document.getElementById('pphoto').click();
    if (t.closest('#clear-ex')) {
      S.sessions = S.sessions.filter(function (s) { return !s.ex; });
      S.weights = S.weights.filter(function (x) { return !x.ex; });
      save(); renderProg(); return toast('Exemplos removidos.');
    }
    if (t.closest('#psave')) {
      S.name = (document.getElementById('pname').value.trim() || 'Atleta');
      S.goal = +document.getElementById('pgoal').value; S.place = document.getElementById('pplace').value;
      var ag = parseInt(document.getElementById('page').value, 10); if (ag >= 10 && ag <= 100) S.age = ag;
      save(); return toast('Perfil salvo.');
    }
    var rb = t.closest('#reset');
    if (rb) {
      if (rb.dataset.sure) { try { localStorage.removeItem(KEY); } catch (x) {} S = { name: 'Atleta', goal: 4, onboarded: false, place: 'academia', sessions: [], weights: [] }; save(); showOnb(1); go('home'); return toast('Dados apagados.'); }
      rb.dataset.sure = '1'; rb.textContent = 'Toque de novo para confirmar'; setTimeout(function () { if (rb.isConnected) { delete rb.dataset.sure; rb.textContent = 'Apagar dados'; } }, 4000);
    }
  });
  document.getElementById('app').addEventListener('submit', function (e) {
    if (e.target.id !== 'wform') return;
    e.preventDefault();
    var v = parseFloat(document.getElementById('wval').value.replace(',', '.'));
    if (!(v >= 20 && v <= 400)) return toast('Digite um peso entre 20 e 400 kg.');
    var today = ymd(new Date());
    S.weights = S.weights.filter(function (x) { return x.date !== today; });
    S.weights.push({ date: today, v: v }); save(); renderProg(); toast('Peso registrado.');
  });

  /* ---------- boas-vindas: aparece só na primeira vez ---------- */
  var onb = document.getElementById('onb');
  var ICON_GYM = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="11" width="5" height="18" rx="2"/><rect x="3" y="15" width="4" height="10" rx="2"/><rect x="26" y="11" width="5" height="18" rx="2"/><rect x="33" y="15" width="4" height="10" rx="2"/><path d="M14 20h12"/></svg>';
  var ICON_HOME = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 19L20 7l15 12"/><path d="M9 16v17h22V16"/><path d="M16 33V23h8v10"/></svg>';
  function showOnb(step) {
    onb.hidden = false;
    var dots = '<div class="steps" aria-hidden="true">' + [1, 2, 3, 4].map(function (i) { return '<i' + (i <= step ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
    if (step === 1) {
      onb.innerHTML = '<div class="onb-in">' + dots +
        '<svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><use href="#logo"/></svg>' +
        '<div><p class="eyebrow" style="margin:0 0 6px">Bem-vindo ao Sayajin Evolution</p><h1>Qual é o seu nome?</h1><p class="muted" style="margin:8px 0 0">Vamos usar o seu nome para personalizar o app.</p></div>' +
        '<form id="nform"><input id="nname" maxlength="24" autocomplete="given-name" placeholder="Digite seu nome" aria-label="Seu nome" value="' + (S.name && S.name !== 'Atleta' ? esc(S.name) : '') + '"><button class="btn" type="submit" id="nnext">Continuar</button></form></div>';
      var inp = document.getElementById('nname'), nx = document.getElementById('nnext');
      var upd = function () { nx.disabled = !inp.value.trim(); };
      inp.addEventListener('input', upd); upd();
    } else if (step === 2) {
      onb.innerHTML = '<div class="onb-in">' + dots +
        '<div><p class="eyebrow" style="margin:0 0 6px">Prazer, ' + esc(S.name) + '</p><h1>Onde você vai treinar?</h1><p class="muted" style="margin:8px 0 0">Você pode mudar isso depois, no Perfil.</p></div>' +
        '<div class="choices"><button class="choice" data-place="academia">' + ICON_GYM + '<div><b>Academia</b><span>Máquinas, barras e halteres</span></div></button>' +
        '<button class="choice" data-place="casa">' + ICON_HOME + '<div><b>Casa</b><span>Peso do corpo, sem equipamento</span></div></button></div>' +
        '<button class="btn ghost sm" style="align-self:flex-start" data-nback>‹ Voltar</button></div>';
    } else if (step === 3) {
      onb.innerHTML = '<div class="onb-in">' + dots +
        '<div><p class="eyebrow" style="margin:0 0 6px">Quase lá, ' + esc(S.name) + '</p><h1>Quantos anos você tem?</h1><p class="muted" style="margin:8px 0 0">A idade fica salva no seu perfil.</p></div>' +
        '<form id="aform"><input id="nage" type="number" inputmode="numeric" min="10" max="100" placeholder="Sua idade" aria-label="Sua idade" value="' + (S.age || '') + '"><button class="btn" type="submit">Continuar</button></form>' +
        '<button class="btn ghost sm" style="align-self:flex-start" data-nstep="2">‹ Voltar</button></div>';
      var ai = document.getElementById('nage'); if (ai) ai.focus();
    } else {
      onb.innerHTML = '<div class="onb-in">' + dots +
        '<div><p class="eyebrow" style="margin:0 0 6px">Último passo</p><h1>Escolha sua foto de perfil</h1><p class="muted" style="margin:8px 0 0">Ela aparece no Início. Você pode trocar depois, no Perfil.</p></div>' +
        '<div class="pv">' + (S.photo ? '<img src="' + S.photo + '" alt="Pré-visualização da foto de perfil">' : '<span aria-hidden="true">' + esc((S.name || '?').charAt(0).toUpperCase()) + '</span>') + '</div>' +
        '<input type="file" id="nphoto" accept="image/*" hidden>' +
        '<button class="btn ghost" id="npick">' + (S.photo ? 'Trocar foto' : 'Escolher foto') + '</button>' +
        '<button class="btn" id="nfinish">' + (S.photo ? 'Concluir' : 'Pular e concluir') + '</button>' +
        '<button class="btn ghost sm" style="align-self:flex-start" data-nstep="3">‹ Voltar</button></div>';
    }
  }
  var LOAD_MS = 2800;
  function showLoading(done) {
    var ld = document.getElementById('ld');
    ld.innerHTML = '<div class="wrap"><svg class="spin" viewBox="0 0 176 176" aria-hidden="true"><circle cx="88" cy="88" r="82" fill="none" stroke="var(--surface2)" stroke-width="4"/><circle cx="88" cy="88" r="82" fill="none" stroke="url(#ringg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="140 376"/></svg>' +
      '<div class="pic">' + (S.photo ? '<img src="' + S.photo + '" alt="Sua foto de perfil">' : '<svg viewBox="0 0 200 200" aria-hidden="true"><use href="#logo"/></svg>') + '</div></div>' +
      '<p>Carregando informações</p>';
    onb.hidden = true; ld.hidden = false;
    setTimeout(function () { ld.hidden = true; ld.innerHTML = ''; if (done) done(); }, LOAD_MS);
  }
  function avatar(big) {
    var c = 'avatar' + (big ? ' big' : '');
    return S.photo ? '<img class="' + c + '" src="' + S.photo + '" alt="Sua foto de perfil">' : '<svg class="' + c + '" viewBox="0 0 200 200" aria-hidden="true"><use href="#logo"/></svg>';
  }
  function readPhoto(file, done) {
    if (!file || file.type.indexOf('image/') !== 0) return toast('Escolha um arquivo de imagem.');
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var n = 320, c = document.createElement('canvas'); c.width = c.height = n;
        var s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, n, n);
        S.photo = c.toDataURL('image/jpeg', 0.82); save(); done();
      };
      img.onerror = function () { toast('Não consegui abrir essa imagem.'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  onb.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'nform') {
      var v = document.getElementById('nname').value.trim();
      if (!v) return;
      S.name = v; save(); showOnb(2);
    } else if (e.target.id === 'aform') {
      var age = parseInt(document.getElementById('nage').value, 10);
      if (!(age >= 10 && age <= 100)) return toast('Digite uma idade entre 10 e 100 anos.');
      S.age = age; save(); showOnb(4);
    }
  });
  onb.addEventListener('click', function (e) {
    if (e.target.closest('[data-nback]')) return showOnb(1);
    var ns = e.target.closest('[data-nstep]'); if (ns) return showOnb(+ns.dataset.nstep);
    if (e.target.closest('#npick')) return document.getElementById('nphoto').click();
    if (e.target.closest('#nfinish')) {
      S.onboarded = true; save(); go('home');
      return showLoading(function () { toast('Tudo pronto, ' + S.name + '! Bem-vindo ao Sayajin Evolution.'); });
    }
    var c = e.target.closest('[data-place]');
    if (!c) return;
    S.place = c.dataset.place; save(); showOnb(3);
  });
  onb.addEventListener('change', function (e) {
    if (e.target.id === 'nphoto') readPhoto(e.target.files[0], function () { showOnb(4); });
  });
  document.getElementById('app').addEventListener('change', function (e) {
    if (e.target.id === 'pphoto') readPhoto(e.target.files[0], function () { renderPerfil(); toast('Foto atualizada.'); });
  });
  if (S.onboarded && !S.age) { S.onboarded = false; save(); showOnb(3); }
  else if (!S.onboarded) showOnb(1);

  go('home');
})();
</script>

</body></html>
